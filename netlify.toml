# Netlify build configuration for the NGJFI platform (Next.js App Router).
# Connect this repo in Netlify once; every pull request then gets its own
# Deploy Preview URL, and merges to `main` publish to production.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Official Next.js runtime for Netlify (SSR, API routes, image optimisation).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The service worker must never be served stale, or a fix to it could take
# days to reach phones. The browser still caches it for at most a request.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
